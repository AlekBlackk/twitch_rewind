<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Twitch Rewind</title>
  <link rel="stylesheet" href="player.css">
  <script src="../../vendor/hls.min.js"></script>
  <script src="../../vendor/mux.min.js"></script>
  <script type="module" src="player.js"></script>
</head>
<body>
  <header id="titlebar" title="Перетащите, чтобы переместить окно">
    <button id="back" hidden>← К списку</button>
    <p id="status" role="status"></p>
    <button id="minimize" title="Свернуть" aria-label="Свернуть">—</button>
    <button id="close" aria-label="Закрыть">✕</button>
  </header>

  <section id="browse">
    <div id="toolbar">
      <form id="channel-form">
        <input id="channel" list="channel-suggestions" placeholder="Ник или ссылка на канал" aria-label="Канал" autocomplete="off" spellcheck="false">
        <datalist id="channel-suggestions"></datalist>
        <button title="Открыть записи канала">Поиск</button>
        <button type="button" id="follow" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.3 3 4.5 6.7 4.5c2 0 3.7 1.1 5.3 3 1.6-1.9 3.3-3 5.3-3 3.7 0 5.9 3.8 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
        </button>
      </form>
      <input id="search" type="search" placeholder="Поиск по названию" aria-label="Поиск по названию">
      <select id="period" aria-label="Период">
        <option value="">За всё время</option>
        <option value="1">За сутки</option>
        <option value="7">За 7 дней</option>
        <option value="30">За 30 дней</option>
        <option value="90">За 3 месяца</option>
      </select>
      <select id="sort" aria-label="Сортировка">
        <option value="new">Сначала новые</option>
        <option value="old">Сначала старые</option>
        <option value="long">Сначала длинные</option>
      </select>
      <div id="view" role="group" aria-label="Вид">
        <button data-view="grid">Плитки</button>
        <button data-view="rows">Список</button>
      </div>
    </div>
    <div id="watched-row" hidden>
      <button id="page-channel" title="Вернуться к каналу этой страницы" hidden></button>
      <span id="watched-label">Отслеживаются:</span>
      <ul id="watched"></ul>
    </div>
    <ul id="list"></ul>
  </section>

  <main id="watch" hidden>
    <div class="player">
      <div id="stage">
        <video id="video" playsinline></video>
        <div id="bar">
          <div id="seek-wrap">
            <input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Перемотка">
            <div id="seek-marks" aria-hidden="true"></div>
          </div>
          <div class="row">
            <button id="play" aria-label="Играть"></button>
            <button id="mute" aria-label="Звук"></button>
            <input id="volume" type="range" min="0" max="1" step="0.05" aria-label="Громкость">
            <button id="go-live" hidden></button>
            <span id="time"></span>
            <span class="spacer"></span>
            <button id="clip" aria-label="Создать клип" title="Создать клип"></button>
            <div class="menu-wrap" id="quality-wrap" hidden>
              <button id="quality" aria-haspopup="true" aria-label="Качество"></button>
              <ul id="quality-menu" hidden></ul>
            </div>
            <button id="fullscreen" aria-label="На весь экран"></button>
          </div>
        </div>
      </div>
      <div id="controls">
        <button data-seek="-300">−5 мин</button>
        <button data-seek="-30">−30 с</button>
        <button data-seek="30">+30 с</button>
      </div>
    </div>
    <aside id="side">
      <div id="tabs" role="tablist">
        <button id="tab-chat" role="tab" aria-selected="true" aria-controls="chat">Чат</button>
        <button id="tab-moments" role="tab" aria-selected="false" aria-controls="moments">Моменты<span id="moments-count"></span></button>
      </div>
      <ol id="chat" aria-label="Чат"></ol>
      <section id="moments" aria-label="Моменты по ключевым словам" hidden>
        <textarea id="keywords" rows="3" aria-label="Ключевые слова" spellcheck="false"
          placeholder="Слова и фразы, по одному в строке.&#10;Хватит части слова"></textarea>
        <div id="moments-run">
          <select id="moments-language" aria-label="Язык речи">
            <option value="russian">Русский</option>
            <option value="english">English</option>
            <option value="">Определять сам</option>
          </select>
          <button id="moments-reset" hidden title="Стереть распознанный текст этого эфира и распознать его заново">Заново</button>
          <button id="moments-toggle">Распознавать речь</button>
        </div>
        <p id="moments-status" role="status"></p>
        <ol id="moments-list" aria-label="Найденные моменты"></ol>
      </section>
    </aside>
  </main>

  <dialog id="clip-dialog" aria-labelledby="clip-heading">
    <form id="clip-form">
      <header>
        <h2 id="clip-heading">Создать клип</h2>
        <button type="button" id="clip-close" aria-label="Закрыть">✕</button>
      </header>
      <video id="clip-video" playsinline></video>
      <div id="clip-range">
        <div id="clip-selection">
          <button type="button" id="clip-from" class="handle" aria-label="Начало клипа"></button>
          <button type="button" id="clip-to" class="handle" aria-label="Конец клипа"></button>
          <div id="clip-playhead"></div>
        </div>
      </div>
      <div id="clip-controls">
        <button type="button" id="clip-play"></button>
        <button type="button" id="clip-mute"></button>
        <p id="clip-times"></p>
      </div>
      <input id="clip-title" required placeholder="Название клипа (обязательно)" aria-label="Название клипа" autocomplete="off">
      <p id="clip-message" role="status"></p>
      <footer>
        <button type="button" id="clip-cancel">Отмена</button>
        <button id="clip-save">Сохранить клип</button>
      </footer>
    </form>
  </dialog>

  <div id="resize" title="Потяните, чтобы изменить размер окна"></div>
</body>
</html>
